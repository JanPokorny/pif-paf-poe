<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Pif-paf-poe — the 9x9 arena</title>
<link rel="stylesheet" href="ppp.css">

<!-- The 9x9 arena: nine zones of nine spaces, every other zone tinted, continuing
     the same veto pattern as the 6x6 -- one across and three down, so no line of three
     repeats one. A space carries its name and the type it switches off along the top,
     and keeps its middle free for a mark. Print at 100%, no fit-to-page. -->

<ppp-page style="--ppp-space: 21mm">
  <ppp-arena size="big">
    <ppp-zone>
      <ppp-space veto="neutral" name="NW1"></ppp-space>
      <ppp-space veto="shift" name="NW2"></ppp-space>
      <ppp-space veto="2048" name="NW3"></ppp-space>
      <ppp-space veto="rotate" name="NW4"></ppp-space>
      <ppp-space veto="mountain" name="NW5"></ppp-space>
      <ppp-space veto="magnet" name="NW6"></ppp-space>
      <ppp-space veto="stinky" name="NW7"></ppp-space>
      <ppp-space veto="neutral" name="NW8"></ppp-space>
      <ppp-space veto="shift" name="NW9"></ppp-space>
    </ppp-zone>
    <ppp-zone>
      <ppp-space veto="rotate" name="N1"></ppp-space>
      <ppp-space veto="mountain" name="N2"></ppp-space>
      <ppp-space veto="magnet" name="N3"></ppp-space>
      <ppp-space veto="stinky" name="N4"></ppp-space>
      <ppp-space veto="neutral" name="N5"></ppp-space>
      <ppp-space veto="shift" name="N6"></ppp-space>
      <ppp-space veto="2048" name="N7"></ppp-space>
      <ppp-space veto="rotate" name="N8"></ppp-space>
      <ppp-space veto="mountain" name="N9"></ppp-space>
    </ppp-zone>
    <ppp-zone>
      <ppp-space veto="stinky" name="NE1"></ppp-space>
      <ppp-space veto="neutral" name="NE2"></ppp-space>
      <ppp-space veto="shift" name="NE3"></ppp-space>
      <ppp-space veto="2048" name="NE4"></ppp-space>
      <ppp-space veto="rotate" name="NE5"></ppp-space>
      <ppp-space veto="mountain" name="NE6"></ppp-space>
      <ppp-space veto="magnet" name="NE7"></ppp-space>
      <ppp-space veto="stinky" name="NE8"></ppp-space>
      <ppp-space veto="neutral" name="NE9"></ppp-space>
    </ppp-zone>
    <ppp-zone>
      <ppp-space veto="2048" name="W1"></ppp-space>
      <ppp-space veto="rotate" name="W2"></ppp-space>
      <ppp-space veto="mountain" name="W3"></ppp-space>
      <ppp-space veto="magnet" name="W4"></ppp-space>
      <ppp-space veto="stinky" name="W5"></ppp-space>
      <ppp-space veto="neutral" name="W6"></ppp-space>
      <ppp-space veto="shift" name="W7"></ppp-space>
      <ppp-space veto="2048" name="W8"></ppp-space>
      <ppp-space veto="rotate" name="W9"></ppp-space>
    </ppp-zone>
    <ppp-zone>
      <ppp-space veto="magnet" name="C1"></ppp-space>
      <ppp-space veto="stinky" name="C2"></ppp-space>
      <ppp-space veto="neutral" name="C3"></ppp-space>
      <ppp-space veto="shift" name="C4"></ppp-space>
      <ppp-space veto="2048" name="C5"></ppp-space>
      <ppp-space veto="rotate" name="C6"></ppp-space>
      <ppp-space veto="mountain" name="C7"></ppp-space>
      <ppp-space veto="magnet" name="C8"></ppp-space>
      <ppp-space veto="stinky" name="C9"></ppp-space>
    </ppp-zone>
    <ppp-zone>
      <ppp-space veto="shift" name="E1"></ppp-space>
      <ppp-space veto="2048" name="E2"></ppp-space>
      <ppp-space veto="rotate" name="E3"></ppp-space>
      <ppp-space veto="mountain" name="E4"></ppp-space>
      <ppp-space veto="magnet" name="E5"></ppp-space>
      <ppp-space veto="stinky" name="E6"></ppp-space>
      <ppp-space veto="neutral" name="E7"></ppp-space>
      <ppp-space veto="shift" name="E8"></ppp-space>
      <ppp-space veto="2048" name="E9"></ppp-space>
    </ppp-zone>
    <ppp-zone>
      <ppp-space veto="mountain" name="SW1"></ppp-space>
      <ppp-space veto="magnet" name="SW2"></ppp-space>
      <ppp-space veto="stinky" name="SW3"></ppp-space>
      <ppp-space veto="neutral" name="SW4"></ppp-space>
      <ppp-space veto="shift" name="SW5"></ppp-space>
      <ppp-space veto="2048" name="SW6"></ppp-space>
      <ppp-space veto="rotate" name="SW7"></ppp-space>
      <ppp-space veto="mountain" name="SW8"></ppp-space>
      <ppp-space veto="magnet" name="SW9"></ppp-space>
    </ppp-zone>
    <ppp-zone>
      <ppp-space veto="neutral" name="S1"></ppp-space>
      <ppp-space veto="shift" name="S2"></ppp-space>
      <ppp-space veto="2048" name="S3"></ppp-space>
      <ppp-space veto="rotate" name="S4"></ppp-space>
      <ppp-space veto="mountain" name="S5"></ppp-space>
      <ppp-space veto="magnet" name="S6"></ppp-space>
      <ppp-space veto="stinky" name="S7"></ppp-space>
      <ppp-space veto="neutral" name="S8"></ppp-space>
      <ppp-space veto="shift" name="S9"></ppp-space>
    </ppp-zone>
    <ppp-zone>
      <ppp-space veto="rotate" name="SE1"></ppp-space>
      <ppp-space veto="mountain" name="SE2"></ppp-space>
      <ppp-space veto="magnet" name="SE3"></ppp-space>
      <ppp-space veto="stinky" name="SE4"></ppp-space>
      <ppp-space veto="neutral" name="SE5"></ppp-space>
      <ppp-space veto="shift" name="SE6"></ppp-space>
      <ppp-space veto="2048" name="SE7"></ppp-space>
      <ppp-space veto="rotate" name="SE8"></ppp-space>
      <ppp-space veto="mountain" name="SE9"></ppp-space>
    </ppp-zone>
  </ppp-arena>
</ppp-page>
