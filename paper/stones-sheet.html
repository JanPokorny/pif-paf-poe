<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Pif-paf-poe — a sheet of stones</title>
<link rel="stylesheet" href="ppp.css">

<!-- 48 stones to cut up: X across the top half, O across the bottom, a column to a
     type, four of each a side. One even grid, so every gap is the same and the halfway
     cut is no different from the rest. Nothing is drawn to cut along -- cut down the
     middle of the gaps, and a wobble leaves no line on the piece. Print at 100%, no
     fit-to-page. -->

<ppp-page>
  <ppp-tray>
    <ppp-stone player="X" type="shift"></ppp-stone>
    <ppp-stone player="X" type="2048"></ppp-stone>
    <ppp-stone player="X" type="rotate"></ppp-stone>
    <ppp-stone player="X" type="mountain"></ppp-stone>
    <ppp-stone player="X" type="magnet"></ppp-stone>
    <ppp-stone player="X" type="stinky"></ppp-stone>
    <ppp-stone player="X" type="shift"></ppp-stone>
    <ppp-stone player="X" type="2048"></ppp-stone>
    <ppp-stone player="X" type="rotate"></ppp-stone>
    <ppp-stone player="X" type="mountain"></ppp-stone>
    <ppp-stone player="X" type="magnet"></ppp-stone>
    <ppp-stone player="X" type="stinky"></ppp-stone>
    <ppp-stone player="X" type="shift"></ppp-stone>
    <ppp-stone player="X" type="2048"></ppp-stone>
    <ppp-stone player="X" type="rotate"></ppp-stone>
    <ppp-stone player="X" type="mountain"></ppp-stone>
    <ppp-stone player="X" type="magnet"></ppp-stone>
    <ppp-stone player="X" type="stinky"></ppp-stone>
    <ppp-stone player="X" type="shift"></ppp-stone>
    <ppp-stone player="X" type="2048"></ppp-stone>
    <ppp-stone player="X" type="rotate"></ppp-stone>
    <ppp-stone player="X" type="mountain"></ppp-stone>
    <ppp-stone player="X" type="magnet"></ppp-stone>
    <ppp-stone player="X" type="stinky"></ppp-stone>
    <ppp-stone player="O" type="shift"></ppp-stone>
    <ppp-stone player="O" type="2048"></ppp-stone>
    <ppp-stone player="O" type="rotate"></ppp-stone>
    <ppp-stone player="O" type="mountain"></ppp-stone>
    <ppp-stone player="O" type="magnet"></ppp-stone>
    <ppp-stone player="O" type="stinky"></ppp-stone>
    <ppp-stone player="O" type="shift"></ppp-stone>
    <ppp-stone player="O" type="2048"></ppp-stone>
    <ppp-stone player="O" type="rotate"></ppp-stone>
    <ppp-stone player="O" type="mountain"></ppp-stone>
    <ppp-stone player="O" type="magnet"></ppp-stone>
    <ppp-stone player="O" type="stinky"></ppp-stone>
    <ppp-stone player="O" type="shift"></ppp-stone>
    <ppp-stone player="O" type="2048"></ppp-stone>
    <ppp-stone player="O" type="rotate"></ppp-stone>
    <ppp-stone player="O" type="mountain"></ppp-stone>
    <ppp-stone player="O" type="magnet"></ppp-stone>
    <ppp-stone player="O" type="stinky"></ppp-stone>
    <ppp-stone player="O" type="shift"></ppp-stone>
    <ppp-stone player="O" type="2048"></ppp-stone>
    <ppp-stone player="O" type="rotate"></ppp-stone>
    <ppp-stone player="O" type="mountain"></ppp-stone>
    <ppp-stone player="O" type="magnet"></ppp-stone>
    <ppp-stone player="O" type="stinky"></ppp-stone>
  </ppp-tray>
</ppp-page>
