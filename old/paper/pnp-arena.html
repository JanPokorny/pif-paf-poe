<!doctype html>
<html lang="cs">
<meta charset="utf-8">
<title>Pif-paf-poe — aréna, zóna na arch</title>
<link rel="stylesheet" href="ppp.css">

<!-- The arena as nine sheets, one zone of nine spaces each. The first four (SZ, SV,
     JZ, JV) glued in a 2x2 make the 6x6; all nine in a 3x3 make the 9x9. Print the
     set twice: trim one to the zone border and glue it into the overview map for the
     central location, cut the other into single spaces to hang at the duel stations.
     Each space carries its name and the stone type it switches off along the top,
     leaving the middle free for a mark. The vetoes continue the 9x9 pattern -- one
     across and three down. Print at 100%, no fit-to-page. -->

<ppp-page style="--ppp-space: 60mm">
  <ppp-zone>
    <ppp-space veto="neutral" name="SZ1"></ppp-space>
    <ppp-space veto="shift" name="SZ2"></ppp-space>
    <ppp-space veto="2048" name="SZ3"></ppp-space>
    <ppp-space veto="rotate" name="SZ4"></ppp-space>
    <ppp-space veto="mountain" name="SZ5"></ppp-space>
    <ppp-space veto="magnet" name="SZ6"></ppp-space>
    <ppp-space veto="stinky" name="SZ7"></ppp-space>
    <ppp-space veto="neutral" name="SZ8"></ppp-space>
    <ppp-space veto="shift" name="SZ9"></ppp-space>
  </ppp-zone>
</ppp-page>

<ppp-page style="--ppp-space: 60mm">

    <ppp-space veto="stinky" name="SV1"></ppp-space>
