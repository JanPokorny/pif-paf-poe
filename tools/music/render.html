<!doctype html><meta charset="utf-8"><title>render</title>
<script type="module">
import { renderTrack, renderStinger } from './compose.js';
// Float32 → 16-bit PCM, base64, to hand to Node.
const pack = (f) => {
  const i16 = new Int16Array(f.length);
  for (let k = 0; k < f.length; k++) i16[k] = Math.max(-32768, Math.min(32767, Math.round(f[k] * 32767)));
  let s = ''; const b = new Uint8Array(i16.buffer);
  for (let k = 0; k < b.length; k += 0x8000) s += String.fromCharCode(...b.subarray(k, k + 0x8000));
  return btoa(s);
};
window.track = async (act, scene, bars) => { const r = await renderTrack(act, scene, bars); let peak = 0; for (const v of r.data) peak = Math.max(peak, Math.abs(v)); return { ...r, data: pack(r.data), peak }; };
window.stinger = async (act, kind) => { const r = await renderStinger(act, kind); return { data: pack(r.data) }; };
// Where a decoded MP3's first sample of music sits: the encoder pads the start.
window.offsetOf = async (mp3b64, pcmb64) => {
  const bytes = Uint8Array.from(atob(mp3b64), (c) => c.charCodeAt(0));
  const ac = new OfflineAudioContext(1, 1, 44100);
  const dec = (await ac.decodeAudioData(bytes.buffer)).getChannelData(0);
  const ref = new Int16Array(Uint8Array.from(atob(pcmb64), (c) => c.charCodeAt(0)).buffer);
  let best = 0, bestErr = Infinity;
  for (let o = 0; o < 4000; o++) {
    let err = 0;
    for (let k = 2000; k < 12000; k += 3) { const d = dec[k + o] - ref[k] / 32767; err += d * d; }
    if (err < bestErr) { bestErr = err; best = o; }
  }
  return { offset: best, decoded: dec.length };
};
window.ready = true;
</script>
